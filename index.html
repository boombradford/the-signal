<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>The Vessl - Independent News Reader</title>
    <meta name="title" content="The Vessl - Independent News Reader" />
    <meta name="description" content="The Vessl is an indie-minded RSS reader with AI-powered summaries. Cut through the noise. Read what matters." />
    <meta name="keywords" content="RSS reader, indie news, alternative media, AI summaries, feed reader, independent journalism, music news, culture reader" />
    <meta name="author" content="The Vessl" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Vessl - Independent News Reader" />
    <meta property="og:description" content="An indie-minded RSS reader with AI summaries. Cut through the noise. Read what matters." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="The Vessl" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Vessl - Independent News Reader" />
    <meta name="twitter:description" content="An indie-minded RSS reader with AI summaries. Cut through the noise." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA & Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Vessl" />
    <meta name="application-name" content="The Vessl" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a1a1a" />

    <!-- Typography: Heavy editorial + readable body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
