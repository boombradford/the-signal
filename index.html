<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>Kevin - AI News Reader</title>
    <meta name="title" content="Kevin - AI News Reader" />
    <meta name="description" content="Kevin is your friendly AI-powered RSS reader. Cut through the noise. Read what matters." />
    <meta name="keywords" content="RSS reader, AI news, AI summaries, feed reader, news aggregator, smart reader" />
    <meta name="author" content="Kevin" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kevin - AI News Reader" />
    <meta property="og:description" content="Your friendly AI-powered RSS reader. Cut through the noise. Read what matters." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Kevin" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kevin - AI News Reader" />
    <meta name="twitter:description" content="Your friendly AI-powered RSS reader. Cut through the noise." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA & Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kevin" />
    <meta name="application-name" content="Kevin" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a1a1a" />

    <!-- Typography: System font stack (SF Pro on Apple devices) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
