<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Primary Meta Tags -->
    <title>The Signal - AI-Powered News Reader</title>
    <meta name="title" content="The Signal - AI-Powered News Reader" />
    <meta name="description" content="The Signal is an AI-powered RSS news reader with intelligent article summaries, clean reading experience, and offline support. Stay informed with less noise." />
    <meta name="keywords" content="RSS reader, news aggregator, AI summaries, feed reader, article reader, news app, RSS feed, content aggregator, AI news, smart reader" />
    <meta name="author" content="The Signal" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Signal - AI-Powered News Reader" />
    <meta property="og:description" content="An AI-powered RSS news reader with intelligent article summaries, clean reading experience, and offline support. Stay informed with less noise." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="The Signal" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Signal - AI-Powered News Reader" />
    <meta name="twitter:description" content="An AI-powered RSS news reader with intelligent article summaries, clean reading experience, and offline support." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA & Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Signal" />
    <meta name="application-name" content="The Signal" />
    <meta name="theme-color" content="#007AFF" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#007AFF" />

    <!-- Fonts: Outfit for UI, Source Serif 4 for reading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
