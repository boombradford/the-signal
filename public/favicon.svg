<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Premium multi-stop gradient -->
    <linearGradient id="kevinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A5C"/>
      <stop offset="35%" style="stop-color:#E55D8A"/>
      <stop offset="70%" style="stop-color:#AF52DE"/>
      <stop offset="100%" style="stop-color:#7B68EE"/>
    </linearGradient>
    <!-- Top shine gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="30%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="60%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Inner shadow -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    <!-- Text shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
    <!-- Sparkle glow -->
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with premium gradient -->
  <rect width="100" height="100" rx="22" fill="url(#kevinGrad)"/>

  <!-- Shine overlay -->
  <rect width="100" height="100" rx="22" fill="url(#shineGrad)"/>

  <!-- Inner edge highlight -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- K letter with shadow -->
  <text
    x="50"
    y="71"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
    font-size="64"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    filter="url(#textShadow)"
    letter-spacing="-2"
  >K</text>

  <!-- Premium sparkle cluster -->
  <g filter="url(#sparkleGlow)">
    <circle cx="82" cy="16" r="5" fill="white" opacity="0.95"/>
    <circle cx="82" cy="16" r="2.5" fill="white"/>
  </g>

  <!-- Secondary sparkle -->
  <circle cx="86" cy="22" r="2" fill="white" opacity="0.6"/>
</svg>
